async function render(){clearInterval(OT);const o=document.getElementById('sh');if(o)o.remove();nav();const m=$('#m');$('#ci').style.display='none';m.style.paddingBottom='';
 if(!tg||!tg.initData){m.innerHTML='<div class="card">Bu sahifa faqat Telegram bot ichida ochiladi.</div>';return}
 m.innerHTML='<div class="card mut">Yuklanmoqda…</div>';
 if(tab==='ofis'){const [d,b]=await Promise.all([agentlar(),api('bosh')]);if(!d){m.innerHTML=denied();return}
  const ish=d.agentlar.filter(a=>a.h==='ishlayapti').length;
  m.innerHTML=`<h2>Visart ofisi</h2><div class="mut" style="margin:-8px 0 12px">${ish} ta agent ishlayapti · Media-server: ${d.media?'<span class="ok">yoqilgan</span>':'<span class="err">o\'chiq</span>'}</div>${ofisSvg(d.agentlar)}<h2 style="font-size:19px;margin:18px 0 10px">Bugun e'tibor kerak</h2>${bugun(d,b)}`;ofisJon(d.agentlar)}
 else if(tab==='agent'){const d=await agentlar();if(!d){m.innerHTML=denied();return}
  m.innerHTML=`<h2>Agentlar</h2>`+d.agentlar.map(a=>`<div class="card"><div class="sheet">${person(a.id,a.h)}<div style="flex:1"><b>${esc(a.nom)}</b><div class="mut">${esc(a.rol)}</div><div style="margin-top:6px;font-size:13px"><span class="dot ${a.h}"></span>${HL[a.h]||''} · ${esc(a.i||'')}</div></div></div>${a.kutish?'':`<div style="margin-top:8px">${acts(a.id)}<button class="chip" onclick="go('chat','${a.id}')">${ic('chat')} Chat</button></div>`}</div>`).join('')}
 else if(tab==='boshq')boshq();
 else chatView()}
const SEAT=i=>({x:60+120*(i%3),y:18+78*Math.floor(i/3)});
const REST=[[48,336],[98,336],[75,396],[200,306],[190,368],[236,368],[300,352],[332,352]];
function fig(a,x,y,rest){const c=COL[a.id]||'#c4a876',sk='#e9c9a6';
 return `<g class="fg a-${a.h}" data-id="${a.id}" style="transform:translate(${x}px,${y}px)" onclick="agSheet('${a.id}')"><ellipse cx="0" cy="3" rx="9" ry="6" fill="#0007"/><g class="bb"><line class="al" x1="-6" y1="-3" x2="-4.5" y2="-11" stroke="${sk}" stroke-width="2.6" stroke-linecap="round"/><line class="ar" x1="6" y1="-3" x2="4.5" y2="-11" stroke="${sk}" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="0" cy="1" rx="8" ry="5.6" fill="${c}"/><circle cx="0" cy="-1" r="5" fill="#2b2118"/><circle cx="0" cy="-1.8" r="3.9" fill="${sk}"/></g>${!rest&&(a.h==='kutmoqda'||a.h==='xato')?`<circle class="pu" cx="0" cy="-17" r="7" fill="${a.h==='xato'?'#ff6b6b':'#e8c27a'}"/><text x="0" y="-13.5" font-size="10" font-weight="700" text-anchor="middle" fill="#151412">!</text>`:''}<circle cx="0" cy="0" r="14" fill="transparent"/></g>`}
function ofisSvg(L){let desks='',figs='',ri=0;
 L.forEach((a,i)=>{const {x,y}=SEAT(i),c=COL[a.id]||'#c4a876',at=a.h!=='dam';
  desks+=`<rect x="${x-36}" y="${y}" width="72" height="26" rx="3" fill="#4a3d2a" stroke="#6b5a3c" stroke-width=".8"/><rect x="${x-13}" y="${y+3}" width="26" height="5" rx="1" fill="#0d0c0a"/><rect class="${a.h==='ishlayapti'?'gl':''}" x="${x-11.5}" y="${y+4}" width="23" height="3" fill="${at?(a.h==='xato'?'#a33':c):'#1a1814'}" opacity="${at?.9:.5}"/><rect x="${x-9}" y="${y+14}" width="18" height="5" rx="1" fill="#2a2620"/><circle cx="${x}" cy="${y+40}" r="8.5" fill="#26231e" stroke="#3a352d"/><text x="${x}" y="${y+64}" font-size="9" fill="#cfc7b8" text-anchor="middle">${esc(a.nom)}</text>`;
  if(at)figs+=fig(a,x,y+40,0);else{const r=REST[ri++%REST.length];figs+=fig(a,r[0],r[1],1)}});
 return `<svg class="of" id="of" viewBox="0 0 360 440" aria-label="Ofis">
<defs><pattern id="fl" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#1a1713"/><path d="M0 0h12v12" fill="none" stroke="#ffffff07"/></pattern><pattern id="fl2" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#1b1a1e"/><path d="M0 0h14v14" fill="none" stroke="#ffffff08"/></pattern></defs>
<rect width="360" height="440" fill="#0e0d0c"/>
<rect x="4" y="4" width="352" height="252" rx="6" fill="url(#fl)" stroke="#A9895A" stroke-width="1.5"/><text x="12" y="250" font-size="8" fill="#A9895A" letter-spacing="1.5">ISH XONASI</text>
<rect x="4" y="262" width="150" height="174" rx="6" fill="url(#fl2)" stroke="#A9895A" stroke-width="1.5"/><text x="12" y="430" font-size="8" fill="#A9895A" letter-spacing="1.5">DAM OLISH</text>
<rect x="158" y="262" width="110" height="174" rx="6" fill="url(#fl2)" stroke="#A9895A" stroke-width="1.5"/><text x="166" y="430" font-size="8" fill="#A9895A" letter-spacing="1.5">OSHXONA</text>
<rect x="272" y="262" width="84" height="174" rx="6" fill="url(#fl2)" stroke="#A9895A" stroke-width="1.5"/><text x="280" y="430" font-size="8" fill="#A9895A" letter-spacing="1.5">HOJATXONA</text>
<rect x="14" y="270" width="130" height="10" rx="2" fill="#0d0c0a" stroke="#575046"/><rect x="14" y="300" width="64" height="28" rx="7" fill="#3a4a58"/><rect x="82" y="300" width="62" height="28" rx="7" fill="#3a4a58"/><rect x="50" y="372" width="50" height="22" rx="4" fill="#4a3d2a"/><circle cx="130" cy="402" r="9" fill="#2f5a3a"/>
<rect x="166" y="270" width="94" height="16" rx="2" fill="#3a352d"/><rect x="170" y="272" width="16" height="12" fill="#6a6f73"/><rect x="194" y="272" width="30" height="12" fill="#26231e"/><circle cx="213" cy="368" r="22" fill="#4a3d2a" stroke="#6b5a3c"/><circle cx="213" cy="368" r="4" fill="#6b5a3c"/>
<rect x="280" y="268" width="30" height="46" rx="2" fill="none" stroke="#575046"/><rect x="318" y="268" width="30" height="46" rx="2" fill="none" stroke="#575046"/><rect x="288" y="274" width="14" height="14" rx="5" fill="#cfd4d8"/><rect x="326" y="274" width="14" height="14" rx="5" fill="#cfd4d8"/><rect x="284" y="396" width="64" height="9" rx="2" fill="#3a352d"/>
${desks}${figs}</svg>`}
function ofisJon(L){const R=[...document.querySelectorAll('#of .a-dam')];if(!R.length)return;let k=0;
 OT=setInterval(()=>{const sp=[...REST].sort(()=>Math.random()-.5);R.forEach((g,i)=>{if(Math.random()<.35)return;const [x,y]=sp[i%sp.length];g.style.transform=`translate(${x}px,${y}px)`;g.classList.add('yuradi');setTimeout(()=>g.classList.remove('yuradi'),3300)})},6500)}
function agSheet(id){const a=((AG&&AG.agentlar)||[]).find(x=>x.id===id);if(!a)return;const o=document.getElementById('sh');if(o)o.remove();
 const e=document.createElement('div');e.id='sh';e.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><b style="font-size:17px;font-family:'Playfair Display',Georgia,serif">${esc(a.nom)}</b><div class="mut">${esc(a.rol)}</div></div><button class="lg" onclick="document.getElementById('sh').remove()">Yopish</button></div><div style="margin:10px 0;font-size:14px"><span class="dot ${a.h}"></span>${HL[a.h]||''} · ${esc(a.i||'')}</div><div>${acts(a.id)}${a.kutish?'':`<button class="chip" onclick="cur='${a.id}';go('chat')">Chat</button>`}</div>`;document.body.appendChild(e)}
function bugun(d,b){const t=[];b=b||{};
 if(!d.media)t.push(['er',"Media-server o'chiq","Video va rasm ishlari to'xtab qoldi. Kompyuterni tekshiring.",'']);
 d.agentlar.filter(a=>a.h==='xato').forEach(a=>t.push(['er',a.nom+': muammo',a.i,`<button class="chip" onclick="agSheet('${a.id}')">Ochish</button>`]));
 if(b.tayyor)t.push(['',b.tayyor+" ta tayyor video tasdig'ingizni kutmoqda","Ko'rib chiqing va joylashga ruxsat bering.",`<button class="chip" onclick="sub='tayyor';go('boshq')">Ko'rish</button>`]);
 if(b.taklif)t.push(['',b.taklif+" ta reklama taklifi","Targetolog taklifini ko'rib, tasdiqlang yoki rad eting.",`<button class="chip" onclick="sub='target';go('boshq')">Ko'rish</button>`]);
 d.agentlar.filter(a=>a.h==='kutmoqda'&&a.id!=='smm').forEach(a=>t.push(['',a.nom+': sizni kutmoqda',a.i,`<button class="chip" onclick="agSheet('${a.id}')">Ochish</button>`]));
 if(b.lid)t.push(['ok2',"Bugun "+b.lid+" ta yangi lid","Mijozga tezroq javob bering.",`<button class="chip" onclick="sub='lid';go('boshq')">Lidlar</button>`]);
 if(!b.navbat)t.push(['',"Nashr navbati bo'sh","Taklif: Senarist yangi reel senariysini tayyorlasin, siz tasdiqlaysiz.",`<button class="chip" onclick="run('reel')">Reel senariysi</button>`]);
 return t.length?t.map(([c,h,s,a])=>`<div class="bg ${c}"><div style="flex:1"><b>${esc(h)}</b><div class="mut">${esc(s)}</div>${a}</div></div>`).join(''):`<div class="bg ok2"><div><b>Bugun hammasi joyida</b><div class="mut">Tasdiq kutayotgan ish yo'q.</div></div></div>`}
function acts(id){return {senarist:`<button class="chip" onclick="run('reel')">Yangi reel senariysi</button>`,montajchi:`<button class="chip" onclick="run('animatsiya')">Yangi animatsiya</button><button class="chip" onclick="sub='tayyor';go('boshq')">Tayyor ishlar</button>`,smm:`<button class="chip" onclick="sub='navbat';go('boshq')">Nashr navbati</button>`,targetolog:`<button class="chip" onclick="sub='target';go('boshq')">Kampaniyalar</button>`,mijoz:`<button class="chip" onclick="sub='lid';go('boshq')">Lidlar</button>`,nazorat:`<button class="chip" onclick="AG=null;go('ofis')">Holatni yangilash</button>`,seo:`<button class="chip" onclick="sub='seoyukla';go('boshq')">Rasm yuborish</button><span class="mut" style="font-size:12.5px">/seo, /domen — botda</span>`}[id]||''}
async function run(a){const ok=!tg||!tg.showConfirm||await new Promise(r=>tg.showConfirm(a==='reel'?'Senarist yangi reel senariysini tayyorlasinmi?':'Yangi animatsiya buyurtma qilinsinmi?',r));if(!ok)return;const d=await api(a);msg(d.ok?'Buyruq yuborildi. Natija botga keladi.':'Xato: '+(d.sabab||'bajarilmadi'))}
function msg(t){tg&&tg.showAlert?tg.showAlert(t):0}
const sega=(arr,c,fn)=>`<div class="seg" style="margin-bottom:12px">${arr.map(([v,l])=>`<button class="${c===v?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
function setSub(v){sub=v;render()}
async function boshq(){const m=$('#m');m.innerHTML=`<h2>Boshqaruv</h2>`+sega([['tayyor','Tayyor ishlar'],['navbat','Navbat'],['target','Target'],['lid','Lidlar'],['ob','Obyektlar'],['seoyukla','SEO rasm']],sub,'setSub')+'<div id="c"><div class="card mut">Yuklanmoqda…</div></div>';const c=$('#c');
 if(sub==='tayyor'){const d=await api('tayyor');c.innerHTML=!d.ok?denied():d.rows.length?d.rows.map(r=>`<div class="card" id="v${r.id}">${r.video?`<video src="${esc(r.video)}" controls playsinline preload="metadata" style="width:100%;border-radius:10px;background:#000;max-height:320px"></video>`:''}<div style="margin-top:8px"><b>#${r.id}</b> ${esc(r.sarlavha)}</div><div class="mut">${esc(r.sana)}</div><div class="grid"><button class="btn" onclick="amal('joylash',${r.id})">Joylash</button><button class="btn line" onclick="amal('bekor',${r.id})">Bekor</button></div></div>`).join(''):'<div class="card mut">Tasdiq kutayotgan video yo\'q.</div>'}
 else if(sub==='seoyukla')seoForma(c);
 else if(sub==='navbat'){const d=await api('navbat');c.innerHTML=!d.ok?denied():d.rows.map(r=>`<div class="card"><b>${esc(r.turi)}</b> <span class="mut">· ${esc(HOL[r.holat]||r.holat)}</span><div class="mut">${esc(r.sarlavha)}</div><div class="mut">${esc(String(r.vaqt||'').replace('T',' ').slice(0,16))}</div></div>`).join('')||'<div class="card mut">Bo\'sh.</div>'}
 else if(sub==='target'){const d=await api('target');c.innerHTML=(!d.ok?denied():d.rows.map(r=>`<div class="card"><b>#${r.id} ${esc(r.nom)}</b><div class="mut">${esc(HOL[r.holat]||r.holat)}${r.kun?` · ${r.kun}$/kun × ${r.kunlar} kun`:''}</div></div>`).join('')||'<div class="card mut">Kampaniya yo\'q.</div>')+`<div class="card mut">Byudjetni tasdiqlash va yoqish xavfsizlik uchun faqat botda: /target</div>`}
 else if(sub==='lid'){const d=await api('lidlar');if(!d.ok){c.innerHTML=denied();return}c.innerHTML=[...d.bot.map(x=>`<div class="card"><b>${esc(x.ism)}</b> <a href="tel:${esc(x.telefon)}" style="color:var(--gold-l)">${esc(x.telefon)}</a><div class="mut">Bot · ${esc(x.xizmat_turi||'')} ${x.maydon_m2||''} · ${esc(String(x.created_at||'').slice(0,10))}</div></div>`),...d.sayt.map(x=>`<div class="card"><b>${esc(x.name)}</b> <a href="tel:${esc(x.phone)}" style="color:var(--gold-l)">${esc(x.phone)}</a><div class="mut">Sayt · ${esc(x.service||'')} · ${esc(String(x.created_at||'').slice(0,10))}</div></div>`)].join('')||'<div class="card mut">Lid yo\'q.</div>'}
 else{const d=await api('obyektlar');c.innerHTML=!d.ok?denied():d.rows.map(r=>`<div class="card"><b>${esc(r.nom)}</b><div class="mut">${esc(r.holat||'')}</div></div>`).join('')}}
const SN={sayt:'Sayt',yandex:'Yandex',google:'Google',gis:'2GIS'};let SF=[];
function seoForma(c){c.innerHTML=`<div class="card"><b>SEO agent: rasm yuborish</b><div class="mut" style="margin:6px 0">Qayerga joylansin:</div><div class="pills" id="sn">${Object.entries(SN).map(([k,l])=>`<button data-k="${k}" class="${k==='sayt'?'on':''}" onclick="this.classList.toggle('on')">${l}</button>`).join('')}</div><input id="sf" type="file" accept="image/*" multiple style="margin:10px 0;width:100%"><div class="mut" id="si"></div><button class="chip" id="sb" onclick="seoYubor()">Yuborish</button><div class="mut" style="margin-top:8px">Rasmlar yuborilgach botda «Rasmlar tugadimi?» deb so'raladi.</div></div>`;$('#sf').onchange=e=>{SF=[...e.target.files].slice(0,20);$('#si').textContent=SF.length+' ta rasm tanlandi'}}
function kichray(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,2400/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>r(b),'image/jpeg',.9)};im.onerror=()=>r(null);im.src=URL.createObjectURL(f)})}
async function seoYubor(){const n={};document.querySelectorAll('#sn button').forEach(b=>n[b.dataset.k]=b.classList.contains('on'));if(!Object.values(n).some(Boolean))return msg('Kamida bitta joyni tanlang');if(!SF.length)return msg('Rasm tanlang');
 const b=$('#sb');b.disabled=true;$('#si').textContent='Tayyorlanmoqda…';const fd=new FormData();fd.append('initData',tg.initData);fd.append('n',JSON.stringify(n));
 for(const f of SF){const k=await kichray(f);if(k)fd.append('rasm',k,'r.jpg')}
 $('#si').textContent='Yuborilmoqda…';let d;try{d=await (await fetch('/api/ilova-seo-yukla',{method:'POST',body:fd})).json()}catch(e){d={ok:false}}
 b.disabled=false;if(d.ok){$('#si').textContent='';SF=[];msg(d.soni+' ta rasm yuborildi. Botga o\'ting: «Rasmlar tugadimi?»')}else{$('#si').textContent='';msg('Xato: '+(d.error||'yuborilmadi'))}}
async function amal(a,id){const el=document.getElementById('v'+id);if(a==='bekor'&&tg&&tg.showConfirm){const ok=await new Promise(r=>tg.showConfirm('Bu videoni bekor qilasizmi?',r));if(!ok)return}
 if(el)el.style.opacity='.5';const d=await api(a,{id});if(d.ok){if(el)el.innerHTML='<div class="ok">'+(a==='joylash'?'Joylashga yuborildi':'Bekor qilindi')+'</div>'}else{if(el)el.style.opacity='1';msg('Xato: '+(d.sabab||'amal bajarilmadi'))}}
function chatView(){const m=$('#m');$('#ci').style.display='flex';m.style.paddingBottom='70px';
 const ags=(AG&&AG.agentlar||[]).filter(a=>!a.kutish);
 m.innerHTML=`<h2>Agentlar bilan chat</h2><div class="pills">${ags.map(a=>`<button class="${cur===a.id?'on':''}" onclick="cur='${a.id}';chatView()">${esc(a.nom)}</button>`).join('')}</div><div id="msgs">${(CHAT[cur]||[{me:0,t:'Salom! Qanday yordam kerak? Holatni so\'rang yoki buyruq bering.'}]).map(bub).join('')}</div>`;
 if(!AG)agentlar().then(()=>chatView());window.scrollTo(0,document.body.scrollHeight)}
const bub=x=>`<div class="bubble ${x.me?'me':''}">${esc(x.t)}${x.amal?`<div><button class="chip" onclick="run('${x.amal}')">${x.amal==='reel'?'Reel senariysini boshlash':'Animatsiyani boshlash'}</button></div>`:''}</div>`;
async function send(){const i=$('#cm');const t=i.value.trim();if(!t)return;i.value='';(CHAT[cur]=CHAT[cur]||[{me:0,t:'Salom! Qanday yordam kerak? Holatni so\'rang yoki buyruq bering.'}]).push({me:1,t});CHAT[cur].push({me:0,t:'…'});chatView();
 const d=await api('chat',{agent:cur,text:t});CHAT[cur].pop();CHAT[cur].push({me:0,t:d.ok?d.javob:'Javob olinmadi.',amal:d.amal||null});chatView()}
$('#cs').onclick=send;$('#cm').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
render();
</script>
