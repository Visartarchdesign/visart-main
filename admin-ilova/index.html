function ofisJon(L){const ag=document.getElementById('ag');if(!ag)return;const G=graf(L.length),cnt=Math.min(L.length,10);
 const ns='http://www.w3.org/2000/svg',drp=document.getElementById('drp');let dop=0;
 const REST=['SF1','SF2','KT1','KT2','H1','H2','KM'];
 const A=L.map((a,i)=>{const e=document.createElementNS(ns,'g');e.innerHTML=sprite(a);const el=e.firstChild;ag.appendChild(el);
  const g={a,i,el,home:i<cnt?'S'+i:null,node:null,path:[],wait:2+Math.random()*6,ph:Math.random()*6,mode:'stand',cup:false,tgt:null,dir:1,x:0,y:0,
   q:{st:el.querySelector('.stn'),si:el.querySelector('.sit'),cp:el.querySelector('.cp'),bb:el.querySelector('.bb'),fl:el.querySelector('.fl'),nm:el.querySelector('.nm'),l1:el.querySelector('.l1'),l2:el.querySelector('.l2'),a1:el.querySelector('.a1'),b1:el.querySelector('.b1')}};
  let s0=g.home;if(a.h==='dam'||!s0)s0=REST[i%REST.length];g.node=s0;g.x=G.nodes[s0][0];g.y=G.nodes[s0][1];g.mode=/^(S|SF|KT)/.test(s0)?'sit':'stand';g.cup=(s0==='S'+i&&a.h==='ishlayapti');if(s0==='S'+i)g.wait=14+Math.random()*20;
  return g});
 const sitN=n=>/^(S\d|SF\d$|KT\d$)/.test(n);
 function git(g,dst){const p=yol(G,g.node,dst);if(!p.length)return false;g.path=p.map(id=>({id,xy:G.nodes[id]}));g.tgt=dst;return true}
 const busy=(g,n)=>A.some(o=>o!==g&&(o.tgt===n||o.node===n&&!o.path.length));
 function decide(g){const a=g.a;
  if(g.home&&a.h!=='dam'){if(g.node!==g.home){g.cup=false;git(g,g.home);return}
   if(a.h==='ishlayapti'&&Math.random()<.18){git(g,'KM');return}
   g.wait=16+Math.random()*24;return}
  if(g.home&&a.h==='dam'&&g.node===g.home){const o=['SF1','SF2','KT1','KT2','H1','H2','KM','WI'].filter(n=>!busy(g,n));git(g,o[Math.floor(Math.random()*o.length)]);return}
  const o=['SF1','SF2','KT1','KT2','H1','H2','KM','WI','WI'].filter(n=>n!==g.node&&!busy(g,n));if(!o.length){g.wait=3;return}git(g,o[Math.floor(Math.random()*o.length)])}
 function arrive(g){g.node=g.tgt;const n=g.node;g.tgt=null;
  if(g.home&&n===g.home){g.mode='sit';g.dir=1;g.cup=g.a.h==='ishlayapti';g.wait=16+Math.random()*24}
  else if(n==='SF1'||n==='SF2'){g.mode='sit';g.dir=1;g.wait=9+Math.random()*9}
  else if(n==='KT1'){g.mode='sit';g.dir=1;g.cup=true;g.wait=8+Math.random()*6}
  else if(n==='KT2'){g.mode='sit';g.dir=-1;g.cup=true;g.wait=8+Math.random()*6}
  else if(n==='KM'){g.mode='stand';g.dir=-1;g.cup=true;g.wait=4+Math.random()*3}
  else if(n==='WI'){g.mode='stand';g.wait=5+Math.random()*4}
  else{g.mode='stand';g.dir=1;g.wait=3+Math.random()*5}}
 let last=performance.now(),k=0;
 function frame(t){OT=requestAnimationFrame(frame);if(!document.getElementById('ag'))return;const dt=Math.min(.1,(t-last)/1000);last=t;k++;
  A.forEach(g=>{
   if(g.path.length){const tg=g.path[0].xy,dx=tg[0]-g.x,dy=tg[1]-g.y,dd=Math.hypot(dx,dy),sp=36*dt;
    if(dd<=sp){g.x=tg[0];g.y=tg[1];g.node=g.path[0].id;g.path.shift();if(!g.path.length)arrive(g)}else{g.x+=dx/dd*sp;g.y+=dy/dd*sp;if(Math.abs(dx)>.5)g.dir=dx>0?1:-1}
    g.mode='walk';g.ph+=dt*11}
   else{g.wait-=dt;if(g.wait<=0)decide(g)}
   const sit=g.mode==='sit',walk=g.mode==='walk',q=g.q;
   g.el.setAttribute('transform',`translate(${g.x.toFixed(1)} ${g.y.toFixed(1)})`);
   q.fl.setAttribute('transform',`scale(${g.dir} 1)`);

   q.st.setAttribute('display',sit?'none':'inline');q.si.setAttribute('display',sit?'inline':'none');
   if(walk){const s=Math.sin(g.ph)*5;q.l1.setAttribute('x2',s);q.l2.setAttribute('x2',-s);q.a1.setAttribute('x2',-s*.6)}
   else if(!sit){q.l1.setAttribute('x2',0);q.l2.setAttribute('x2',0);q.a1.setAttribute('x2',1)}
   if(sit){const w=(g.a.h==='ishlayapti'&&g.node===g.home);q.b1.setAttribute('y2',-16+(w?Math.sin(t/80+g.i)*1.8:0))}
   q.cp.setAttribute('display',g.cup&&!(sit&&g.node===g.home)?'inline':'none');
   q.nm.setAttribute('display',sit&&g.node===g.home?'none':'inline');
   const bw=(g.a.h==='kutmoqda'||g.a.h==='xato')&&sit&&g.node===g.home;q.bb.setAttribute('display',bw?'inline':'none');q.bb.firstElementChild.setAttribute('fill',g.a.h==='xato'?'#ff6b6b':'#e8c27a')});
  const near=A.some(g=>Math.abs(g.x-284)<22&&Math.abs(g.y-(F1+LN))<4);dop+=((near?1:0)-dop)*Math.min(1,dt*8);drp.setAttribute('transform',`translate(286 0) scale(${(1-dop*.8).toFixed(2)} 1) translate(-286 0)`);
  if(k%3===0){const ord=[...ag.children].sort((a,b)=>(+a.getAttribute('transform').split(' ')[1].replace(')',''))-(+b.getAttribute('transform').split(' ')[1].replace(')','')));let ch=false;for(let i=0;i<ord.length;i++)if(ag.children[i]!==ord[i]){ch=true;break}if(ch)ord.forEach(e=>ag.appendChild(e))}}
 OT=requestAnimationFrame(frame)}

 else if(AS==='guruh'){const d=await aApi('guruhlar');if(!d){a.innerHTML=denied();return}a.innerHTML=`<div class="card"><b>Ulangan guruhlar</b>${d.guruhlar.map(g=>`<div class="chk" style="justify-content:space-between"><div><div>${esc(g.nom)}</div><div class="mut">${g.rol} → ${esc(g.obyekt)}</div></div><button class="chip" style="margin:0" onclick="gUz('${g.gid}')">🔌 Uzish</button></div><div style="display:flex;gap:6px;margin:4px 0 10px"><select id="gr${g.gid}" style="flex:0 0 32%"><option value="m">Mijoz</option><option value="u">Usta</option><option value="o">Oddiy</option></select><select id="go${g.gid}">${d.obyektlar.map(o=>`<option value="${esc(o.id)}">${esc(o.nom)}</option>`).join('')}</select><button class="chip" style="margin:0" onclick="gSet('${g.gid}')">OK</button></div>`).join('')||'<div class="mut">Yo\'q</div>'}</div><div class="card"><b>Ulanmagan</b>${d.ulanmagan.map(o=>`<div class="mut">• ${esc(o.nom)}: ${o.mijoz?'':'mijoz ✗ '}${o.usta?'':'usta ✗'}</div>`).join('')||'<div class="ok">Hammasi ulangan</div>'}<div class="mut" style="margin-top:8px">Yangi guruh: botni guruhga qo'shing — savol o'zi chiqadi.</div></div>`}
 else if(AS==='ulan'){const d=await aApi('ulanishlar');if(!d){a.innerHTML=denied();return}a.innerHTML=d.rows.map(o=>`<div class="card"><b>${esc(o.nom||o.id)}</b> <span class="mut">${esc(o.mijoz_ism||'')}</span><div class="mut" style="margin:4px 0">${esc(o.mijoz_tel||'ulanmagan')}</div><div style="display:flex;gap:8px"><input id="t${esc(o.id)}" inputmode="tel" placeholder="998901234567" style="flex:1"><button class="chip" style="margin:0" onclick="uSet('${esc(o.id)}')">Saqlash</button>${o.mijoz_tel?`<button class="chip" style="margin:0" onclick="uDel('${esc(o.id)}')">🗑</button>`:''}</div></div>`).join('')}
 else if(AS==='admin'){const d=await aApi('adminlar');if(!d){a.innerHTML=denied();return}a.innerHTML=`<div class="card"><b>Adminlar</b>${d.asosiy.map(x=>`<div class="mut">• ${esc(x)} (asosiy)</div>`).join('')}${d.rows.map(x=>`<div class="chk" style="justify-content:space-between"><span>${esc(x.ism||'')} <span class="mut">${x.chat_id}</span></span>${d.root?`<button class="chip" style="margin:0" onclick="aDel(${x.id})">🗑</button>`:''}</div>`).join('')}</div>${d.root?`<button class="chip" onclick="aLink()">➕ Admin qo'shish havolasi</button><div id="al"></div>`:'<div class="mut">Qo\'shish/o\'chirish faqat asosiy adminga.</div>'}`}
 else if(AS==='domen'){const d=await aApi('domen');if(!d){a.innerHTML=denied();return}a.innerHTML=`<div class="card"><b>visartdesign.uz domeni</b><div class="mut" style="margin:6px 0">${d.tugash?`Tugash sanasi: ${esc(d.tugash)} · <b style="color:${d.qoldi<=14?'#ff8b8b':'var(--tx)'}">${d.qoldi} kun qoldi</b>`:'Sana kiritilmagan'}</div><div style="display:flex;gap:8px"><input id="dm" type="date" value="${esc(d.tugash||'')}"><button class="chip" style="margin:0" onclick="dSet()">Saqlash</button></div></div>`}}
async function tmb(text,conf){if(conf&&tg&&tg.showConfirm){const ok=await new Promise(r=>tg.showConfirm(conf,r));if(!ok)return}const d=await api('matn_buyruq',{text});msg(d.ok?'Yuborildi. Natija botga keladi.':'Xato')}
async function muzlat(){const t=$('#mz').value.trim();if(!t)return;const ok=!tg||!tg.showConfirm||await new Promise(r=>tg.showConfirm('"'+t+'" obyekti mijoz guruhiga muzlatish xabari yuborilsinmi?',r));if(!ok)return;const d=await api('matn_buyruq',{text:'/muzlat '+t});msg(d.ok?'Yuborildi. Natija botga keladi.':'Xato')}
async function nBel(id,ok){if(await aApi('norma_belgila',{id,ok}))asec('norma')}
async function gSet(g){const r=document.getElementById('gr'+g).value,o=document.getElementById('go'+g).value;await tcb(r==='o'?`gset:o:${g}`:`gobj:${r}:${g}:${o}`,r==='o'?'Guruh oddiy guruh qilinsinmi? (obyektdan uziladi)':`Guruh ${r==='m'?'MIJOZLAR':'USTALAR'} guruhi sifatida shu obyektga ulansinmi? Guruhga salom xabari yuboriladi.`);setTimeout(()=>asec('guruh'),4000)}
async function gUz(g){const ok=!tg||!tg.showConfirm||await new Promise(r=>tg.showConfirm('Guruh obyektdan uzilsinmi?',r));if(ok&&await aApi('guruh_uz',{gid:g}))asec('guruh')}
async function uSet(id){const v=document.getElementById('t'+id).value;if(await aApi('ulanish_set',{id,tel:v}))asec('ulan')}
async function uDel(id){const ok=!tg||!tg.showConfirm||await new Promise(r=>tg.showConfirm('Mijoz raqami o\'chirilsinmi? Mijoz obyekt holatini ko\'rolmay qoladi.',r));if(ok&&await aApi('ulanish_del',{id}))asec('ulan')}
async function aDel(id){const ok=!tg||!tg.showConfirm||await new Promise(r=>tg.showConfirm('Admin o\'chirilsinmi?',r));if(ok&&await aApi('admin_del',{id}))asec('admin')}
async function aLink(){const d=await aApi('admin_link');if(d)document.getElementById('al').innerHTML=`<div class="card"><div class="mut">1 marta, 24 soat amal qiladi. Yangi adminga yuboring:</div><div style="word-break:break-all;margin-top:6px">${esc(d.link)}</div></div>`}
async function dSet(){const v=$('#dm').value;if(!v)return;const d=await api('matn_buyruq',{text:'/domen '+v});msg(d.ok?'Saqlandi':'Xato');setTimeout(()=>asec('domen'),2500)}
async function senTuzat(id){const i=document.getElementById('sz'+id),t=i&&i.value.trim();if(!t)return;const d=await api('senariy_tuzat',{id,text:t});msg(d.ok?"Ko'rsatma yuborildi. Tuzatilgan variant tayyor bo'lgach Tasdiq bo'limida ko'rinadi.":'Xato');if(d.ok)setTimeout(boshq,6000)}
let MF=[];
function mediaView(c){c.innerHTML=`<div class="card"><b>Media yuklash</b><div class="mut" style="margin:6px 0">Rasm va videolar (har biri ≤ 50 MB):</div><div class="pills" id="mr"><button class="on" data-r="baza" onclick="mRej(this)">📥 Bazaga (Senarist uchun)</button><button data-r="hozir" onclick="mRej(this)">⚡ Hozir post</button></div><input id="mf" type="file" accept="image/*,video/*" multiple style="margin:6px 0"><div class="mut" id="mi"></div><textarea id="mc" rows="2" placeholder="Ko'rsatma / izoh (Hozir post uchun majburiy)" style="margin:8px 0"></textarea><button class="chip" id="mb" onclick="mYubor()">Yuklash</button><div class="mut" style="margin-top:8px">Bazaga tushganlarni Senarist reel/post uchun ishlatadi. «Hozir post» — bitta fayl va ko'rsatma bilan darhol ishga tushadi.</div></div>`;$('#mf').onchange=e=>{MF=[...e.target.files];$('#mi').textContent=MF.length+' ta fayl tanlandi'}}
function mRej(b){document.querySelectorAll('#mr button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function mYubor(){const rej=document.querySelector('#mr button.on').dataset.r,cap=$('#mc').value.trim();if(!MF.length)return msg('Fayl tanlang');if(rej==='hozir'&&(!cap||MF.length!==1))return msg('«Hozir post» uchun bitta fayl va ko\'rsatma kerak');
 const b=$('#mb');b.disabled=true;const part=String(Date.now());let ok=0;
 for(let i=0;i<MF.length;i++){$('#mi').textContent=`Yuklanmoqda ${i+1}/${MF.length}…`;const fd=new FormData();fd.append('initData',tg.initData);fd.append('rejim',rej);fd.append('caption',cap);fd.append('partiya',part);fd.append('fayl',MF[i],MF[i].name);
  let d;try{d=await (await fetch('/api/ilova-media-yukla',{method:'POST',body:fd})).json()}catch(e){d={ok:false}}
  if(!d.ok){msg('Xato ('+MF[i].name+'): '+(d.error||'yuklanmadi'));break}ok++}
 b.disabled=false;$('#mi').textContent=ok?`${ok} ta fayl yuborildi. Natija botga ham keladi.`:'';if(ok===MF.length){MF=[];$('#mf').value=''}}
const SN={sayt:'Sayt',yandex:'Yandex',google:'Google',gis:'2GIS'};let SF=[];
function seoForma(c){c.innerHTML=`<div class="card"><b>SEO agent: rasm yuborish</b><div class="mut" style="margin:6px 0">Qayerga joylansin:</div><div class="pills" id="sn">${Object.entries(SN).map(([k,l])=>`<button data-k="${k}" class="${k==='sayt'?'on':''}" onclick="this.classList.toggle('on')">${l}</button>`).join('')}</div><input id="sf" type="file" accept="image/*" multiple style="margin:10px 0;width:100%"><div class="mut" id="si"></div><button class="chip" id="sb" onclick="seoYubor()">Yuborish</button><div class="mut" style="margin-top:8px">Rasmlar yuborilgach botda «Rasmlar tugadimi?» deb so'raladi.</div></div>`;$('#sf').onchange=e=>{SF=[...e.target.files].slice(0,20);$('#si').textContent=SF.length+' ta rasm tanlandi'}}
function kichray(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,2400/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>r(b),'image/jpeg',.9)};im.onerror=()=>r(null);im.src=URL.createObjectURL(f)})}
async function seoYubor(){const n={};document.querySelectorAll('#sn button').forEach(b=>n[b.dataset.k]=b.classList.contains('on'));if(!Object.values(n).some(Boolean))return msg('Kamida bitta joyni tanlang');if(!SF.length)return msg('Rasm tanlang');
 const b=$('#sb');b.disabled=true;$('#si').textContent='Tayyorlanmoqda…';const fd=new FormData();fd.append('initData',tg.initData);fd.append('n',JSON.stringify(n));
 for(const f of SF){const k=await kichray(f);if(k)fd.append('rasm',k,'r.jpg')}
 $('#si').textContent='Yuborilmoqda…';let d;try{d=await (await fetch('/api/ilova-seo-yukla',{method:'POST',body:fd})).json()}catch(e){d={ok:false}}
 b.disabled=false;if(d.ok){$('#si').textContent='';SF=[];msg(d.soni+' ta rasm yuborildi. Botga o\'ting: «Rasmlar tugadimi?»')}else{$('#si').textContent='';msg('Xato: '+(d.error||'yuborilmadi'))}}
async function amal(a,id){const el=document.getElementById('v'+id);if(a==='bekor'&&tg&&tg.showConfirm){const ok=await new Promise(r=>tg.showConfirm('Bu videoni bekor qilasizmi?',r));if(!ok)return}
 if(el)el.style.opacity='.5';const d=await api(a,{id});if(d.ok){if(el)el.innerHTML='<div class="ok">'+(a==='joylash'?'Joylashga yuborildi':'Bekor qilindi')+'</div>'}else{if(el)el.style.opacity='1';msg('Xato: '+(d.sabab||'amal bajarilmadi'))}}
async function dirYukla(){if(CHAT.dirYuk)return;CHAT.dirYuk=1;const d=await api('dir_tarix');CHAT.direktor=(d.rows||[]).map(r=>({me:r.rol==='u'?1:0,t:r.t,taklif:r.taklif||null}));if(!CHAT.direktor.length)CHAT.direktor=null}
function chatView(){const m=$('#m');$('#ci').style.display='flex';m.style.paddingBottom='70px';
 const ags=(AG&&AG.agentlar||[]).filter(a=>!a.kutish);
 if(cur==='direktor'&&!CHAT.dirYuk){m.innerHTML='<div class="card mut">Yuklanmoqda…</div>';dirYukla().then(chatView);return}
 const hi=cur==='direktor'?"Salom, Doston! Men direktorman. Qanday ish bo'lsa ayting — agentlarga taqsimlayman, natija yoki muammo bo'lsa o'zim yozaman.":"Salom! Qanday yordam kerak? Holatni so'rang yoki buyruq bering.";
 m.innerHTML=`<h2>Chat</h2><div class="pills">${ags.map(a=>`<button class="${cur===a.id?'on':''}" onclick="cur='${a.id}';chatView()">${esc(a.nom)}</button>`).join('')}</div><div class="mut" style="margin:-4px 0 8px">${cur==='direktor'?"Direktor vazifani taqsimlaydi. Alohida agentga to'g'ridan-to'g'ri buyruq berish uchun yuqoridan agentni tanlang.":'Bu agentga to\'g\'ridan-to\'g\'ri buyruq berasiz.'}</div><div id="msgs">${(CHAT[cur]||[{me:0,t:hi}]).map(bub).join('')}</div>`;
 if(!AG)agentlar().then(()=>chatView());window.scrollTo(0,document.body.scrollHeight)}
const AGN=id=>{const a=((AG&&AG.agentlar)||[]).find(x=>x.id===id);return a?a.nom:id};
const bub=x=>`<div class="bubble ${x.me?'me':''}">${esc(x.t)}${x.amal?`<div><button class="chip" onclick="run('${x.amal}')">${x.amal==='reel'?'Reel senariysini boshlash':'Animatsiyani boshlash'}</button></div>`:''}${(x.taklif||[]).map(k=>k.amal==='vazifa'?`<div class="mut" style="margin-top:6px">📌 ${esc(AGN(k.agent))}: ${esc(k.matn)}</div>`:`<div class="mut" style="margin-top:6px">${esc(AGN(k.agent))}: ${esc(k.matn||'')}</div><button class="chip" onclick="run('${k.amal}')">${k.amal==='reel'?'Reel senariysini boshlash':'Animatsiyani boshlash'}</button>`).join('')}</div>`;
async function send(){const i=$('#cm');const t=i.value.trim();if(!t)return;i.value='';const dir=cur==='direktor';if(dir&&!CHAT.dirYuk)await dirYukla();
 (CHAT[cur]=CHAT[cur]||[{me:0,t:dir?"Salom, Doston! Men direktorman. Qanday ish bo'lsa ayting.":"Salom! Qanday yordam kerak?"}]).push({me:1,t});CHAT[cur].push({me:0,t:'…'});chatView();
 const d=await api(dir?'dir_chat':'chat',{agent:cur,text:t});CHAT[cur].pop();CHAT[cur].push({me:0,t:d.ok?d.javob:'Javob olinmadi.',amal:d.amal||null,taklif:d.taklif||null});AG=null;agentlar();chatView()}
$('#cs').onclick=send;$('#cm').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
render();
</script>
</body>
</html>
