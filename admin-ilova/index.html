<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>Visart Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#151412;--card:#201e1b;--line:#33302b;--tx:#f4efe6;--mut:#a39d93;--gold:#A9895A;--gold-l:#C4A876;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Inter',-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.01em}
h2,.res,header b{font-family:'Playfair Display',Georgia,serif}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex:none}
.ib{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.sv{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#17150f;color:var(--gold-l);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header b{font-size:18px;letter-spacing:.5px}header b span{color:var(--gold-l)}
.lg{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;font-size:12px}
main{padding:8px 16px}
h2{font-size:23px;font-weight:600;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:12.5px;margin:10px 0 5px}
input,select,textarea{width:100%;background:#17150f;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.btn{display:block;width:100%;text-align:center;background:var(--gold);color:#151412;font-weight:700;border:0;border-radius:12px;padding:13px;font-size:15px;margin-top:14px;text-decoration:none}
.btn.line{background:none;border:1px solid var(--gold);color:var(--gold-l)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{flex:1;min-width:30%;background:#17150f;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 6px;font-size:13.5px}
.seg button.on{border-color:var(--gold);background:#2a2419;color:var(--gold-l)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.chk input{width:20px;height:20px;flex:none}
.res{font-size:30px;font-weight:700;color:var(--gold-l);margin:4px 0}.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.pj img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#222}.pj div{padding:8px 10px;font-size:13px}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.pills button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:6px 14px;font-size:13px}.pills button.on{border-color:var(--gold);color:var(--gold-l)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1a1815f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}nav button svg.i{font-size:22px}nav button{font-weight:500;letter-spacing:.02em}nav button.on{color:var(--gold-l)}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:16px;display:none}.modal.show{display:block}.modal img{width:100%;border-radius:10px;margin-bottom:10px;display:block}.x{display:flex;align-items:center;justify-content:center;position:sticky;top:0;float:right;background:#000a;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;z-index:2}
.ok{color:#7fd48a}.err{color:#ff8b8b}.hid{display:none}
iframe#kf{display:none;width:100%;height:calc(100vh - 130px);border:0;background:#fff}
</style></head>
<body>
<header><b>VISART <span>ADMIN</span></b><button class="lg" id="rf">Yangilash</button></header>
<main id="m"><div class="card mut">Yuklanmoqda…</div></main>
<nav id="nav"></nav>
<script>
const IC={bosh:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',kont:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="m10 8 6 4-6 4z"/>',tar:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',mij:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',app:'<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',narx:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 6h8M16 14v4M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/>',xiz:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',loy:'<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>',alo:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',kab:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',interior:'<path d="M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3"/><path d="M2 11v5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v2H6v-2a2 2 0 0 0-4 0z"/><path d="M4 18v2M20 18v2"/>',arch:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>',docs:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',turnkey:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',drawings:'<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0z"/><path d="m14.5 12.5 2-2M11.5 9.5l2-2M8.5 6.5l2-2M17.5 15.5l2-2"/>',go:'<path d="M5 12h14M13 6l6 6-6 6"/>',send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',ig:'<rect width="20" height="20" x="2" y="2" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',pin:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',ok:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>'};
const ic=(n)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#151412');tg.setBackgroundColor('#151412')}catch(e){}}
const $=s=>document.querySelector(s);let tab='bosh',sub='tayyor',lsub='bot';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(amal,x){try{const r=await fetch('/api/ilova-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',amal,...(x||{})})});return await r.json()}catch(e){return {ok:false}}}
const TABS=[['bosh','bosh','Bosh'],['kont','kont','Kontent'],['tar','tar','Target'],['mij','mij','Mijozlar'],['app','app','Ilova']];
function nav(){$('#nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${ic(i)}<span>${l}</span></button>`).join('')}
function go(k){if(k==='app'){location.href='/ilova/';return}tab=k;render()}
$('#rf').onclick=()=>render();
const HOL={kutilmoqda:'Kutilmoqda',bajarilmoqda:'Bajarilmoqda',bajarildi:'Bajarildi',xato:'Xato',bekor:'Bekor',tasdiq_kutilmoqda:'Tasdiq kutmoqda',target_tayyor:'Tayyor',target_faol:'Faol',target_pauza:'Pauza',target_tugadi:'Tugadi'};
const sega=(arr,cur,fn)=>`<div class="seg" style="margin-bottom:12px">${arr.map(([v,l])=>`<button class="${cur===v?'on':''}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
const stat=(n,l,c)=>`<div class="card" style="margin:0"><div class="res" style="font-size:28px;${c||''}">${n}</div><div class="mut">${l}</div></div>`;
async function render(){nav();const m=$('#m');m.innerHTML='<div class="card mut">Yuklanmoqda…</div>';
 if(!tg||!tg.initData){m.innerHTML='<div class="card">Bu sahifa faqat Telegram bot ichida ochiladi.</div>';return}
 if(tab==='bosh'){const d=await api('bosh');if(!d.ok){m.innerHTML=denied(d);return}
  m.innerHTML=`<h2>Agent kompaniyasi</h2><div class="grid">${stat(d.navbat,'Nashr navbatida')}${stat(d.tayyor,'Tasdiq kutayotgan video',d.tayyor?'color:#e8c27a':'')}${stat(d.faol,'Faol kampaniya')}${stat(d.taklif,'Target takliflari')}${stat(d.lid,'Bugungi lid')}${stat(d.obyekt,'Obyektlar')}</div><div class="card" style="margin-top:12px"><span class="ib">${ic(d.media?'ok':'x')} Media-server: ${d.media?'<b class="ok">ishlayapti</b>':'<b class="err">javob bermayapti</b>'}</span></div>`}
 else if(tab==='kont'){m.innerHTML=`<h2>Kontent</h2>`+sega([['tayyor','Tayyor ishlar'],['navbat','Nashr navbati']],sub,'setSub')+'<div id="c"></div>';
  if(sub==='tayyor'){const d=await api('tayyor');$('#c').innerHTML=!d.ok?denied(d):d.rows.length?d.rows.map(r=>`<div class="card" id="v${r.id}">${r.video?`<video src="${esc(r.video)}" controls playsinline preload="metadata" style="width:100%;border-radius:10px;background:#000;max-height:320px"></video>`:''}<div style="margin-top:8px"><b>#${r.id}</b> ${esc(r.sarlavha)}</div><div class="mut">${esc(r.sana)}</div><div class="grid"><button class="btn" onclick="amal('joylash',${r.id})">Joylash</button><button class="btn line" onclick="amal('bekor',${r.id})">Bekor</button></div></div>`).join(''):'<div class="card mut">Tasdiq kutayotgan video yo\'q.</div>'}
  else{const d=await api('navbat');$('#c').innerHTML=!d.ok?denied(d):d.rows.map(r=>`<div class="card"><b>${esc(r.turi)}</b> <span class="mut">· ${esc(HOL[r.holat]||r.holat)}</span><div class="mut">${esc(r.sarlavha)}</div><div class="mut">${esc(String(r.vaqt||'').replace('T',' ').slice(0,16))}</div></div>`).join('')||'<div class="card mut">Bo\'sh.</div>'}}
 else if(tab==='tar'){const d=await api('target');m.innerHTML=`<h2>Marketing va target</h2>`+(!d.ok?denied(d):d.rows.map(r=>`<div class="card"><b>#${r.id} ${esc(r.nom)}</b><div class="mut">${esc(HOL[r.holat]||r.holat)}${r.kun?` · ${r.kun}$/kun × ${r.kunlar} kun`:''}</div></div>`).join('')||'<div class="card mut">Kampaniya yo\'q.</div>')+`<div class="card mut">Byudjetni tasdiqlash va yoqish xavfsizlik uchun faqat botda: /target</div>`}
 else if(tab==='mij'){m.innerHTML=`<h2>Mijozlar</h2>`+sega([['bot','Bot lidlari'],['sayt','Sayt'],['ob','Obyektlar']],lsub,'setL')+'<div id="c"></div>';
  if(lsub==='ob'){const d=await api('obyektlar');$('#c').innerHTML=!d.ok?denied(d):d.rows.map(r=>`<div class="card"><b>${esc(r.nom)}</b><div class="mut">${esc(r.holat||'')}</div></div>`).join('')}
  else{const d=await api('lidlar');if(!d.ok){$('#c').innerHTML=denied(d);return}
   $('#c').innerHTML=lsub==='bot'?(d.bot.map(x=>`<div class="card"><b>${esc(x.ism)}</b> <a href="tel:${esc(x.telefon)}" style="color:var(--gold-l)">${esc(x.telefon)}</a><div class="mut">${esc(x.xizmat_turi||'')} ${x.maydon_m2||''} · ${esc(String(x.created_at||'').slice(0,10))}</div></div>`).join('')||'<div class="card mut">Lid yo\'q.</div>'):(d.sayt.map(x=>`<div class="card"><b>${esc(x.name)}</b> <a href="tel:${esc(x.phone)}" style="color:var(--gold-l)">${esc(x.phone)}</a><div class="mut">${esc(x.service||'')} · ${esc(String(x.created_at||'').slice(0,10))}</div></div>`).join('')||'<div class="card mut">Murojaat yo\'q.</div>')}}}
function denied(d){return `<div class="card err">Ruxsat yo'q yoki xato. Faqat adminlar uchun.</div>`}
function setSub(v){sub=v;render()}function setL(v){lsub=v;render()}
async function amal(a,id){const el=document.getElementById('v'+id);if(a==='bekor'&&tg&&tg.showConfirm){const ok=await new Promise(r=>tg.showConfirm('Bu videoni bekor qilasizmi?',r));if(!ok)return}
 if(el)el.style.opacity='.5';const d=await api(a,{id});if(d.ok){if(el)el.innerHTML='<div class="ok">'+(a==='joylash'?'Joylashga yuborildi':'Bekor qilindi')+'</div>'}else{if(el)el.style.opacity='1';(tg&&tg.showAlert?tg.showAlert('Xato: '+(d.sabab||'amal bajarilmadi')):0)}}
render();
</script>
</body>
</html>
