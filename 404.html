<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<title>Sahifa topilmadi | VISART ARCHDESIGN</title>
<meta name="robots" content="noindex">
<style>
:root{--gold:#A9895A;--gold-l:#C4A876;--ink:#151412;--paper:#FCFBF9;--t1:#151412;--t2:#4F4C43;--t3:#6B675C;--line:#E7E3D9;--serif:'Playfair Display',serif;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--paper);color:var(--t1);-webkit-font-smoothing:antialiased;line-height:1.75}
a{color:inherit}
header{background:var(--ink);padding:22px 0}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--serif);letter-spacing:1px}
.brand img{width:28px;height:auto}
header nav a{color:#B8B2A0;font-size:13px;text-decoration:none;margin-left:18px}
header nav a:hover{color:var(--gold-l)}
main{padding:70px 0 90px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,40px);margin-bottom:10px;line-height:1.25}
h2{font-size:18px;font-weight:600;margin:34px 0 10px}
p,li{font-size:15px;color:var(--t2)}
ul{padding-left:20px;margin:8px 0}
.meta{font-size:13px;color:var(--t3);margin-bottom:30px}
.lang-sep{margin:70px 0 0;padding-top:50px;border-top:0.5px solid var(--line)}
.btn{display:inline-block;margin-top:28px;background:var(--ink);color:#fff;text-decoration:none;padding:15px 30px;font-size:13px;font-weight:600;border-radius:2px}
.btn:hover{background:var(--gold)}
footer{background:var(--ink);color:#8C8676;font-size:12px;padding:26px 0;text-align:center}
</style>

</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><img src="/assets/logo-mark.png" alt="">VISART</a><nav><a href="/">Bosh sahifa</a><a href="/#contact">Bog'lanish</a></nav></div></header>
<main class="wrap" style="text-align:center;padding:110px 24px 130px">
<p class="meta" style="letter-spacing:3px">404</p>
<h1>Bu sahifa topilmadi</h1>
<p>Havola eskirgan yoki manzil noto'g'ri yozilgan bo'lishi mumkin.<br><span lang="ru">Страница не найдена — возможно, ссылка устарела.</span></p>
<a class="btn" href="/">Bosh sahifa</a>
<a class="btn" href="/#projects" style="background:var(--gold);color:var(--ink);margin-left:8px">Loyihalar</a>
</main>
<footer>© 2026 VISART ARCHDESIGN · <a href="/">visartdesign.uz</a></footer>
</body>
</html>
